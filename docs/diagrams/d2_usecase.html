<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif}
.u{fill:#fff;stroke:#2563eb;stroke-width:1.6}.ut{font-size:14px;fill:#0c1530;text-anchor:middle}
.act{font-size:15px;font-weight:700;fill:#0c1530;text-anchor:middle}.l{stroke:#3d4a66;stroke-width:1.3}
</style></head><body>
<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
<defs>
<g id="actor"><circle cx="0" cy="-48" r="14" fill="none" stroke="#0c1530" stroke-width="2"/><line x1="0" y1="-34" x2="0" y2="4" stroke="#0c1530" stroke-width="2"/><line x1="-22" y1="-22" x2="22" y2="-22" stroke="#0c1530" stroke-width="2"/><line x1="0" y1="4" x2="-18" y2="32" stroke="#0c1530" stroke-width="2"/><line x1="0" y1="4" x2="18" y2="32" stroke="#0c1530" stroke-width="2"/></g>
<marker id="g" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L12 6L0 12z" fill="#fff" stroke="#0c1530"/></marker>
</defs>
<text x="600" y="34" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#0c1530">PhishGuard – Use Case Diagram</text>
<rect x="250" y="60" width="700" height="820" rx="16" fill="#f7f9fe" stroke="#9aa8c9" stroke-width="1.5"/>
<text x="600" y="88" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#4a5878">PhishGuard Phishing Detection System</text>

<!-- actors -->
<use href="#actor" x="120" y="250"/><text x="120" y="310" class="act">Guest /</text><text x="120" y="328" class="act">Customer</text>
<use href="#actor" x="120" y="620"/><text x="120" y="680" class="act">Staff user</text>
<use href="#actor" x="1080" y="470"/><text x="1080" y="530" class="act">Administrator</text>
<!-- generalisation staff -> guest -->
<line x1="120" y1="560" x2="120" y2="340" stroke="#0c1530" stroke-width="1.3" marker-end="url(#g)"/>
<text x="130" y="455" style="font-size:12px;fill:#4a5878">inherits</text>

<!-- guest use cases -->
<g>
<ellipse class="u" cx="420" cy="140" rx="140" ry="28"/><text class="ut" x="420" y="145">Scan website URL</text>
<ellipse class="u" cx="420" cy="210" rx="140" ry="28"/><text class="ut" x="420" y="215">View result &amp; phishing alert</text>
<ellipse class="u" cx="420" cy="280" rx="140" ry="28"/><text class="ut" x="420" y="285">Report suspicious site</text>
<ellipse class="u" cx="420" cy="350" rx="140" ry="28"/><text class="ut" x="420" y="355">Learn warning signs / quiz</text>
<ellipse class="u" cx="420" cy="420" rx="140" ry="28"/><text class="ut" x="420" y="425">Register / Sign in</text>
</g>
<line class="l" x1="150" y1="230" x2="280" y2="140"/><line class="l" x1="150" y1="235" x2="280" y2="210"/>
<line class="l" x1="150" y1="240" x2="280" y2="280"/><line class="l" x1="150" y1="245" x2="280" y2="350"/><line class="l" x1="150" y1="250" x2="280" y2="420"/>

<!-- staff use cases -->
<ellipse class="u" cx="420" cy="540" rx="140" ry="28"/><text class="ut" x="420" y="545">View dashboard &amp; responsibilities</text>
<ellipse class="u" cx="420" cy="610" rx="140" ry="28"/><text class="ut" x="420" y="615">Investigate assigned report</text>
<ellipse class="u" cx="420" cy="680" rx="140" ry="28"/><text class="ut" x="420" y="685">Submit finding</text>
<ellipse class="u" cx="420" cy="750" rx="140" ry="28"/><text class="ut" x="420" y="755">View scan history</text>
<ellipse class="u" cx="420" cy="820" rx="140" ry="28"/><text class="ut" x="420" y="825">Change password / profile</text>
<line class="l" x1="150" y1="600" x2="280" y2="540"/><line class="l" x1="150" y1="605" x2="280" y2="610"/>
<line class="l" x1="150" y1="610" x2="280" y2="680"/><line class="l" x1="150" y1="615" x2="280" y2="750"/><line class="l" x1="150" y1="620" x2="280" y2="820"/>
<line x1="420" y1="638" x2="420" y2="652" stroke="#3d4a66" stroke-dasharray="4 3"/><text x="430" y="649" style="font-size:11px;fill:#4a5878">«include»</text>

<!-- admin use cases -->
<ellipse class="u" cx="780" cy="160" rx="140" ry="28"/><text class="ut" x="780" y="165">Monitor threat overview</text>
<ellipse class="u" cx="780" cy="230" rx="140" ry="28"/><text class="ut" x="780" y="235">Investigate URL (scanner)</text>
<ellipse class="u" cx="780" cy="300" rx="140" ry="28"/><text class="ut" x="780" y="305">Assign report to staff</text>
<ellipse class="u" cx="780" cy="370" rx="140" ry="28"/><text class="ut" x="780" y="375">Confirm / reject report</text>
<ellipse class="u" cx="780" cy="440" rx="140" ry="28"/><text class="ut" x="780" y="445">Manage blacklist &amp; trusted list</text>
<ellipse class="u" cx="780" cy="510" rx="140" ry="28"/><text class="ut" x="780" y="515">Create staff &amp; set responsibilities</text>
<ellipse class="u" cx="780" cy="580" rx="140" ry="28"/><text class="ut" x="780" y="585">Run accuracy evaluation</text>
<ellipse class="u" cx="780" cy="650" rx="140" ry="28"/><text class="ut" x="780" y="655">View all scans / export CSV</text>
<g><line class="l" x1="1050" y1="440" x2="920" y2="160"/><line class="l" x1="1050" y1="445" x2="920" y2="230"/><line class="l" x1="1050" y1="450" x2="920" y2="300"/>
<line class="l" x1="1050" y1="455" x2="920" y2="370"/><line class="l" x1="1050" y1="460" x2="920" y2="440"/><line class="l" x1="1050" y1="465" x2="920" y2="510"/>
<line class="l" x1="1050" y1="470" x2="920" y2="580"/><line class="l" x1="1050" y1="475" x2="920" y2="650"/></g>
<line x1="780" y1="398" x2="780" y2="412" stroke="#3d4a66" stroke-dasharray="4 3"/><text x="790" y="409" style="font-size:11px;fill:#4a5878">«extend» adds to blacklist</text>
</svg></body></html>
